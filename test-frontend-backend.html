<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Connection Test</title>
</head>
<body>
    <h1>Testing Frontend-Backend Connection</h1>
    <div id="results"></div>
    
    <script>
        async function testConnection() {
            const results = document.getElementById('results');
            
            try {
                results.innerHTML = '<p>Testing backend health...</p>';
                
                const response = await fetch('http://localhost:3001/api/health');
                const data = await response.json();
                
                results.innerHTML = `
                    <h2>✅ Backend Connection Successful!</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                // Test analytics endpoint
                results.innerHTML += '<p>Testing analytics endpoint...</p>';
                
                const analyticsResponse = await fetch('http://localhost:3001/api/analytics/overview', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        propertyId: '123456789',
                        startDate: '7daysAgo',
                        endDate: 'today'
                    })
                });
                
                const analyticsData = await analyticsResponse.json();
                
                if (analyticsResponse.ok) {
                    results.innerHTML += `
                        <h2>✅ Analytics Endpoint Working!</h2>
                        <p>Status: ${analyticsResponse.status}</p>
                    `;
                } else {
                    results.innerHTML += `
                        <h2>⚠️ Analytics Response (Expected - no access to test property):</h2>
                        <pre>${JSON.stringify(analyticsData, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                results.innerHTML = `
                    <h2>❌ Connection Failed</h2>
                    <p>Error: ${error.message}</p>
                    <p>Make sure the backend server is running on port 3001</p>
                `;
            }
        }
        
        // Test on page load
        testConnection();
    </script>
</body>
</html>
